name: Release

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug (no version bump, no publish, no tag)"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Semantic release
    runs-on:
      - ubuntu-latest

    permissions:
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
      contents: write # to be able to publish a GitHub release
      packages: write # to publish to GitHub Packages (npm.pkg.github.com)
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.PARATCO_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PARATCO_BOT_KEY }}

      - name: Get GitHub App User ID
        id: app-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Semantic Release (Debug Dry Run)
        if: ${{ github.event.inputs.debug == 'true' }}
        run: bun run release-dry-debug
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: ${{ steps.app-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com

      - name: Build
        if: ${{ github.event.inputs.debug != 'true' }}
        run: bun run build

      - name: Semantic Release
        if: ${{ github.event.inputs.debug != 'true' }}
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # GitHub Packages does not accept GitHub App tokens, so publish with the workflow token
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: ${{ steps.app-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
